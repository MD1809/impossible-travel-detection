# ===================================================================
# Cấu hình ứng dụng Impossible Travel Detection Backend
# ===================================================================

# 1. Cấu hình máy chủ Web
server.port=8080
spring.application.name=impossible-travel-detection

# 2. Cấu hình kết nối MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/impossible_travel_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=18092005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. Cấu hình JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# 4. Tự động thực thi Script Migration khởi tạo bảng khi ứng dụng chạy
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migration/V1__initial_schema.sql
